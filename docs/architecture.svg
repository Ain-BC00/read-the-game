<rect x="104" y="758" width="390" height="64" rx="14" fill="#10212b" stroke="#345565"/>
<text x="128" y="785" class="nodeTitle" font-size="17">GitHub Actions</text><text x="128" y="808" class="nodeText">Build and deploy workflow for Azure Static Web Apps</text>
<path d="M494 790H594" stroke="#b9ef3d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="594" y="758" width="390" height="64" rx="14" fill="#10212b" stroke="#345565"/>
<text x="618" y="785" class="nodeTitle" font-size="17">Azure Static Web Apps</text><text x="618" y="808" class="nodeText">Serves the web app and serverless API route</text>
<rect x="1022" y="758" width="468" height="64" rx="14" fill="#10212b" stroke="#345565"/>
<text x="1046" y="785" class="nodeTitle" font-size="17">Explicit scope</text><text x="1046" y="808" class="nodeText">Synthetic timed events only · no external match/video feed</text>
<text x="72" y="900" class="foot">Architecture reflects the code and deployment configuration in this repository. Azure resources and model availability depend on deployment settings.</text>
