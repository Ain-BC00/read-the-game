 <text x="104" y="358" class="nodeText">HTML · CSS · browser JavaScript</text>
 <rect x="104" y="382" width="326" height="66" rx="12" fill="#122637" stroke="#2a4859"/>
 <text x="124" y="409" class="nodeTitle" font-size="16">Timed synthetic event feed</text><text x="124" y="432" class="nodeText">Three fictional sequences · JSON replay</text>
 <rect x="104" y="462" width="326" height="66" rx="12" fill="#122637" stroke="#2a4859"/>
 <text x="124" y="489" class="nodeTitle" font-size="16">Local match intelligence</text><text x="124" y="512" class="nodeText">Passes · pressure · speed · player signals</text>
 <rect x="104" y="542" width="326" height="66" rx="12" fill="#122637" stroke="#2a4859"/>
 <text x="124" y="569" class="nodeTitle" font-size="16">Fan / Analyst · EN / ES</text><text x="124" y="592" class="nodeText">Personalized stories · recap · overlay JSON</text>
</g>

<text x="558" y="212" class="section">AZURE HOSTING · API BOUNDARY</text>
<g filter="url(#shadow)">
 <rect x="530" y="238" width="490" height="400" rx="22" fill="#0e2026" stroke="#b9ef3d" stroke-width="2"/>
 <rect x="554" y="260" width="442" height="60" rx="14" fill="#19332e"/>
 <text x="578" y="286" class="tag">AZURE STATIC WEB APPS</text><text x="578" y="308" class="nodeTitle">Frontend hosting + /api route</text>
 <rect x="570" y="350" width="410" height="116" rx="16" fill="#132a30" stroke="#438c70"/>
 <text x="594" y="381" class="tag">AZURE FUNCTIONS · JAVASCRIPT</text>
 <text x="594" y="412" class="nodeTitle">/api/narrate</text>
 <text x="594" y="439" class="nodeText">JavaScript · Node.js 20+</text>
 <text x="594" y="458" class="nodeText">Validates input · calls Foundry</text>
 <rect x="570" y="488" width="410" height="112" rx="16" fill="#132a30" stroke="#438c70"/>
