<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
<title id="title">READ THE GAME — implementation architecture</title>
<desc id="desc">Browser-generated synthetic football events flow through Azure Static Web Apps and an Azure Function to Microsoft Foundry. Results return to the browser for display and overlay export. GitHub Actions deploys the application.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#0b1d22"/></linearGradient>
 <linearGradient id="glow" x2="1"><stop stop-color="#183a39"/><stop offset="1" stop-color="#102333"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b9ef3d"/></marker>
 <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#56c9ef"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".32"/></filter>
 <style>
  text{font-family:Inter,Arial,sans-serif;fill:#eef5f7}.eyebrow{font-size:15px;font-weight:700;letter-spacing:3px;fill:#64d6a4}.title{font-size:38px;font-weight:800;letter-spacing:.2px}.subtitle{font-size:17px;fill:#a6bac5}.section{font-size:14px;font-weight:800;letter-spacing:2px;fill:#a7bac5}.nodeTitle{font-size:19px;font-weight:800}.nodeText{font-size:14px;fill:#a9bec8}.tag{font-size:12px;font-weight:700;letter-spacing:1px;fill:#c6f346}.edgeLabel{font-size:13px;font-weight:700;fill:#c7d6dc}.foot{font-size:13px;fill:#91a7b3}
 </style>
</defs>
<rect width="1600" height="940" rx="28" fill="url(#bg)"/>
<path d="M0 160H1600" stroke="#203442"/>
<text x="72" y="66" class="eyebrow">READ THE GAME · SYSTEM OVERVIEW</text>
<text x="72" y="116" class="title">From synthetic events to verified match stories</text>
<text x="72" y="145" class="subtitle">A lightweight Azure-hosted web app with a coordinated, evidence-checked narration workflow.</text>

<text x="78" y="212" class="section">USER EXPERIENCE · BROWSER</text>
<g filter="url(#shadow)">
 <rect x="72" y="238" width="390" height="400" rx="22" fill="#101e2c" stroke="#56c9ef" stroke-width="2"/>
 <rect x="94" y="260" width="346" height="60" rx="14" fill="#14283a"/>
