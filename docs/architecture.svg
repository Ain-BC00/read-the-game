 <text x="1128" y="382" class="nodeTitle" font-size="16">Tactical Analyst</text><text x="1128" y="408" class="nodeText">Find grounded signals</text><text x="1128" y="432" class="nodeText">Return event IDs</text>
 <rect x="1300" y="350" width="206" height="112" rx="14" fill="#142a35" stroke="#2a5261"/>
