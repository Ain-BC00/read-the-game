<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">READ THE GAME — system architecture</title>
<desc id="desc">A browser app generates synthetic football events. Azure Static Web Apps hosts the frontend and JavaScript Azure Function. The function calls two coordinated roles on one Microsoft Foundry deployment and returns evidence-checked narration. GitHub Actions deploys the app.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#0b1d22"/></linearGradient>
 <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#102334"/><stop offset="1" stop-color="#102b2c"/></linearGradient>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#b9ef3d"/></marker>
 <marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#56c9ef"/></marker>
 <style>
  text{font-family:Inter,Arial,sans-serif;fill:#eef5f7}.eyebrow{font-size:20px;font-weight:800;letter-spacing:4px;fill:#64d6a4}.title{font-size:46px;font-weight:800}.subtitle{font-size:24px;fill:#afc1cb}.section{font-size:19px;font-weight:800;letter-spacing:2px;fill:#a7bac5}.tag{font-size:17px;font-weight:800;letter-spacing:2px;fill:#c6f346}.heading{font-size:29px;font-weight:800}.body{font-size:22px;fill:#c3d0d7}.small{font-size:19px;fill:#a9bec8}.foot{font-size:18px;fill:#a9bec8}
 </style>
</defs>
<rect width="1600" height="1000" rx="30" fill="url(#bg)"/>
<path d="M0 190H1600" stroke="#203442" stroke-width="2"/>
<text x="72" y="72" class="eyebrow">READ THE GAME · SYSTEM OVERVIEW</text>
<text x="72" y="132" class="title">From synthetic events to match stories</text>
<text x="72" y="171" class="subtitle">A web app turns fictional match actions into personalized, evidence-checked insight.</text>

<!-- Browser -->
<rect x="72" y="250" width="420" height="450" rx="26" fill="url(#panel)" stroke="#56c9ef" stroke-width="3"/>
<text x="108" y="300" class="tag">VIEWER EXPERIENCE</text>
<text x="108" y="350" class="heading">READ THE GAME</text>
<text x="108" y="388" class="body">HTML · CSS · JavaScript</text>
<path d="M108 420H456" stroke="#2a4859" stroke-width="2"/>
<circle cx="124" cy="466" r="7" fill="#56c9ef"/><text x="148" y="474" class="body">Timed synthetic event feed</text>
<circle cx="124" cy="522" r="7" fill="#56c9ef"/><text x="148" y="530" class="body">Tactical view and match metrics</text>
<circle cx="124" cy="578" r="7" fill="#56c9ef"/><text x="148" y="586" class="body">Fan / Analyst · English / Spanish</text>
<circle cx="124" cy="634" r="7" fill="#56c9ef"/><text x="148" y="642" class="body">Recaps and overlay JSON</text>

<!-- Azure -->
<rect x="590" y="250" width="440" height="450" rx="26" fill="url(#panel)" stroke="#b9ef3d" stroke-width="3"/>
<text x="626" y="300" class="tag">AZURE STATIC WEB APPS</text>
<text x="626" y="350" class="heading">Web hosting + API route</text>
<rect x="626" y="382" width="368" height="126" rx="18" fill="#142d2b" stroke="#58bb8b" stroke-width="2"/>
<text x="650" y="423" class="tag">AZURE FUNCTIONS</text>
<text x="650" y="462" class="heading">JavaScript · Node.js 20+</text>
<text x="650" y="492" class="body">/api/narrate</text>
<rect x="626" y="530" width="368" height="128" rx="18" fill="#142d2b" stroke="#58bb8b" stroke-width="2"/>
<text x="650" y="572" class="tag">SERVER-SIDE CHECKS</text>
<text x="650" y="610" class="body">Input validation · rate limit</text>
<text x="650" y="640" class="body">Evidence IDs · protected secrets</text>

<!-- Foundry -->
<rect x="1128" y="250" width="400" height="450" rx="26" fill="url(#panel)" stroke="#64d6a4" stroke-width="3"/>
<text x="1164" y="300" class="tag">MICROSOFT FOUNDRY</text>
<text x="1164" y="350" class="heading">One model deployment</text>
<text x="1164" y="386" class="body">gpt-5-mini</text>
<rect x="1164" y="420" width="328" height="88" rx="16" fill="#142a35" stroke="#2a5261" stroke-width="2"/>
<text x="1188" y="457" class="heading">Tactical Analyst</text>
<text x="1188" y="488" class="small">Finds supported match signals</text>
<rect x="1164" y="526" width="328" height="88" rx="16" fill="#142a35" stroke="#2a5261" stroke-width="2"/>
<text x="1188" y="563" class="heading">Audience Narrator</text>
<text x="1188" y="594" class="small">Adapts to mode and preferences</text>
<text x="1164" y="652" class="small">Sequential roles · same deployment</text>

<!-- Connections -->
<path d="M492 420H590" stroke="#56c9ef" stroke-width="4" marker-end="url(#blue)"/>
<text x="500" y="400" class="small">EVENTS</text>
<path d="M590 570H492" stroke="#b9ef3d" stroke-width="4" marker-end="url(#arrow)"/>
<text x="500" y="607" class="small">INSIGHT</text>
<path d="M1030 450H1128" stroke="#b9ef3d" stroke-width="4" marker-end="url(#arrow)"/>
<text x="1036" y="430" class="small">AI CALL</text>
<path d="M1128 570H1030" stroke="#56c9ef" stroke-width="4" marker-end="url(#blue)"/>
<text x="1040" y="608" class="small">JSON</text>

<!-- Delivery strip -->
<rect x="72" y="758" width="1456" height="160" rx="26" fill="#102428" stroke="#284b4c" stroke-width="2"/>
<text x="108" y="805" class="section">DELIVERY &amp; DATA SCOPE</text>
<rect x="108" y="830" width="450" height="60" rx="15" fill="#10212b" stroke="#345565" stroke-width="2"/>
<text x="132" y="869" class="body">GitHub Actions → Azure deployment</text>
<rect x="584" y="830" width="420" height="60" rx="15" fill="#10212b" stroke="#345565" stroke-width="2"/>
<text x="608" y="869" class="body">Synthetic football events only</text>
<rect x="1030" y="830" width="458" height="60" rx="15" fill="#10212b" stroke="#345565" stroke-width="2"/>
<text x="1054" y="869" class="body">Overlay cues exported as JSON</text>
<text x="72" y="960" class="foot">Architecture diagram reflects the app and services used in this project.</text>
</svg>
